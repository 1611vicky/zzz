<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="theme-color" content="#007aff">
<link rel="manifest" href="manifest.json">
<title>记账本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f2f7;--card:#fff;--txt:#1c1c1e;--txt2:#8e8e93;--txt3:#c7c7cc;--blue:#007aff;--red:#ff3b30;--org:#ff9500;--sep:#e5e5ea;--r:12px;--sb:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--txt:#fff;--txt2:#98989d;--txt3:#48484a;--sep:#38383a}}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{height:100dvh;display:flex;flex-direction:column}
/* tabs */
.tabs{display:flex;background:var(--card);border-top:.5px solid var(--sep);padding-bottom:calc(8px + var(--sb));padding-top:8px;flex-shrink:0}
.tabBtn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt2);font-size:11px;cursor:pointer;padding:0 4px}
.tabBtn.a{color:var(--blue)}.tabBtn svg{width:26px;height:26px}
/* pages */
.pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:0 16px 20px}
.page.a{display:block}
/* header */
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.ph h1{font-size:30px;font-weight:700}
.fab{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* cards */
.crd{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.clbl{font-size:12px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
/* amount display */
.bigAmt{text-align:center;padding:16px 0}
.bigAmt .val{font-size:48px;font-weight:700;letter-spacing:-1px}
.bigAmt .sub{font-size:13px;color:var(--txt2);margin-top:4px}
.zero{color:var(--txt3)}
/* expense row */
.erow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:.5px solid var(--sep);cursor:pointer}
.erow:last-child{border-bottom:none}
.eico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.einfo{flex:1;min-width:0}
.emer{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emeta{font-size:12px;color:var(--txt2);margin-top:2px;display:flex;align-items:center;gap:6px}
.etag{font-size:10px;background:rgba(0,122,255,.12);color:var(--blue);padding:1px 6px;border-radius:8px}
.eamt{font-size:16px;font-weight:600;color:var(--red);flex-shrink:0}
/* cat row */
.catrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--bg);margin-bottom:6px}
.catic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.a{opacity:1;pointer-events:auto}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);padding:0 16px 20px}
.overlay.a .sheet{transform:translateY(0)}
.sheetHdr{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;position:sticky;top:0;background:var(--card);z-index:1}
.sheetTitle{font-size:17px;font-weight:600}
.ghostBtn{background:none;border:none;color:var(--blue);font-size:15px;cursor:pointer;padding:4px 0}
.dangerBtn{color:var(--red)}
/* form */
.frow{display:flex;align-items:center;padding:11px 0;border-bottom:.5px solid var(--sep);gap:10px}
.frow:last-child{border-bottom:none}
.frow label{font-size:14px;color:var(--txt2);min-width:52px;flex-shrink:0}
.frow input,.frow select{flex:1;border:none;background:none;font-size:16px;color:var(--txt);outline:none;font-family:inherit;min-width:0}
.frow select{cursor:pointer;-webkit-appearance:none}
.amtInput{font-size:24px;font-weight:700;color:var(--red)}
/* primary button */
.primBtn{display:block;width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:13px;font-size:17px;font-weight:600;cursor:pointer;margin-top:16px}
.primBtn:disabled{opacity:.35;cursor:default}
/* upload area */
.upArea{display:block;border:2px dashed var(--sep);border-radius:14px;padding:32px 20px;text-align:center;cursor:pointer;margin-bottom:12px;transition:border-color .15s}
.upArea:active{border-color:var(--blue)}
.upEmoji{font-size:44px;margin-bottom:10px}
.upTitle{font-size:16px;font-weight:600;margin-bottom:4px}
.upHint{font-size:13px;color:var(--txt2)}
.preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin:10px 0;display:block}
/* empty */
.empty{text-align:center;padding:60px 20px;color:var(--txt3)}
.emptyIco{font-size:52px;opacity:.35;margin-bottom:12px}
/* month selector */
.msel{display:flex;align-items:center;justify-content:center;gap:20px;padding:8px 0 14px}
.msel .mlbl{font-size:17px;font-weight:600;min-width:90px;text-align:center}
.msel button{width:30px;height:30px;border-radius:50%;border:1px solid var(--sep);background:var(--card);color:var(--blue);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.msel button:disabled{opacity:.3}
/* stats */
.psel{display:flex;background:var(--card);border-radius:9px;overflow:hidden;margin-bottom:14px}
.pbt{flex:1;padding:8px 2px;font-size:13px;font-weight:500;border:none;background:none;color:var(--txt2);cursor:pointer}
.pbt.a{background:var(--blue);color:#fff}
.scards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.scard{background:var(--card);border-radius:10px;padding:12px 8px;text-align:center}
.scard .sv{font-size:17px;font-weight:700}.scard .sl{font-size:11px;color:var(--txt2);margin-top:3px}
/* bar chart */
.barWrap{width:100%;overflow-x:auto}
.barChart{display:flex;align-items:flex-end;gap:3px;height:100px;padding-top:4px}
.bar{flex:1;min-width:8px;border-radius:3px 3px 0 0;background:#4ECDC4;transition:height .3s;cursor:default;position:relative}
.barLbl{font-size:9px;color:var(--txt2);text-align:center;margin-top:3px;white-space:nowrap}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:9px 18px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.a{opacity:1}
input[type=file]{position:absolute;top:-1000px;left:-1000px;opacity:0}
</style>
</head>
<body>
<div class="app">
  <div class="pages" id="pages">
    <!-- TODAY -->
    <div class="page a" id="p-today">
      <div class="ph"><h1>今日</h1><button class="fab" id="fabBtn">＋</button></div>
      <div id="todayC"></div>
    </div>
    <!-- LIST -->
    <div class="page" id="p-list">
      <div class="ph"><h1>账单</h1></div>
      <div id="listC"></div>
    </div>
    <!-- STATS -->
    <div class="page" id="p-stats">
      <div class="ph"><h1>统计</h1></div>
      <div id="statsC"></div>
    </div>
  </div>
  <div class="tabs">
    <button class="tabBtn a" data-p="today" onclick="G.tab('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="7" height="7" rx="1.2"/><rect x="14" y="4" width="7" height="7" rx="1.2"/><rect x="3" y="15" width="7" height="5" rx="1.2"/><rect x="14" y="15" width="7" height="5" rx="1.2"/></svg>今日
    </button>
    <button class="tabBtn" data-p="list" onclick="G.tab('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>账单
    </button>
    <button class="tabBtn" data-p="stats" onclick="G.tab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>统计
    </button>
  </div>
</div>
<!-- SHEET -->
<div class="overlay" id="overlay"><div class="sheet" id="sheetBody"></div></div>
<!-- TOAST -->
<div class="toast" id="toast"></div>
<!-- hidden file input -->
<input type="file" id="fu" accept="image/*" multiple onchange="G.onFiles(this)">

<script src="tesseract.min.js"></script>
<script src="chart.min.js"></script>
<script>
'use strict';
/* Tesseract worker + lang path (local files, no CDN needed) */
const TESS_OPTS = {
  workerPath: 'worker.min.js',
  langPath: 'lang-data',
  corePath: 'tesseract.min.js',
  logger: ()=>{}
};
// ── CATEGORIES ──────────────────────────────────
const CAT = {
  food:{n:'餐饮',e:'🍔',c:'#FF6B6B'},
  transport:{n:'交通',e:'🚗',c:'#4ECDC4'},
  shopping:{n:'购物',e:'🛍️',c:'#FF8E53'},
  entertainment:{n:'娱乐',e:'🎮',c:'#A37EF0'},
  housing:{n:'居住',e:'🏠',c:'#45B7D1'},
  medical:{n:'医疗',e:'💊',c:'#F06292'},
  education:{n:'教育',e:'📚',c:'#81C784'},
  communication:{n:'通讯',e:'📱',c:'#64B5F6'},
  daily:{n:'日用',e:'🧴',c:'#FFD54F'},
  other:{n:'其他',e:'📌',c:'#90A4AE'}
};
const SRCS = {wechat:'微信支付',alipay:'支付宝',bankCard:'银行卡',applePay:'Apple Pay',cash:'现金',other:'其他'};

// ── DB ──────────────────────────────────────────
const DB = {
  _db: null,
  open() {
    return new Promise((ok, fail) => {
      const r = indexedDB.open('jz5', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('ex', {keyPath:'id', autoIncrement:true});
      r.onsuccess = e => { this._db = e.target.result; ok(); };
      r.onerror = e => fail(e.target.error);
    });
  },
  all() {
    return new Promise((ok, fail) => {
      const r = this._db.transaction('ex','readonly').objectStore('ex').getAll();
      r.onsuccess = () => ok(r.result);
      r.onerror = e => fail(e.target.error);
    });
  },
  add(o) {
    return new Promise((ok, fail) => {
      const r = this._db.transaction('ex','readwrite').objectStore('ex').add(o);
      r.onsuccess = () => ok(r.result);
      r.onerror = e => fail(e.target.error);
    });
  },
  del(id) { this._db.transaction('ex','readwrite').objectStore('ex').delete(id); }
};

// ── HELPERS ─────────────────────────────────────
function esc(s){ const d=document.createElement('div');d.textContent=s;return d.innerHTML; }
function fmtDTL(d){ const dt=new Date(d||new Date()); dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset()); return dt.toISOString().slice(0,16); }
function autoCat(m) {
  const s = (m||'').toLowerCase();
  const rules = [
    ['food',['餐','饭','食','饿了么','美团','外卖','奶茶','咖啡','星巴克','肯德基','麦当劳','小吃','fire','food','kfc']],
    ['transport',['滴滴','地铁','公交','火车','高铁','机票','加油','停车','taxi','曹操','哈啰','青桔','出行']],
    ['shopping',['淘宝','天猫','京东','拼多多','超市','便利','商场','百货','购物','shop','mall']],
    ['entertainment',['电影','ktv','游戏','视频','音乐','演出','门票','旅游','酒店','密室','bilibili','steam','抖音']],
    ['housing',['房租','物业','水电','燃气','宽带','暖气','rent']],
    ['medical',['医院','药','诊所','挂号','体检','hospital']],
    ['education',['课程','培训','考试','学习','知识','书','book']],
    ['communication',['话费','流量','移动','联通','电信']],
    ['daily',['理发','洗衣','保洁','快递','维修','日用']],
  ];
  for(const [c,ks] of rules) for(const k of ks) if(s.includes(k)) return c;
  return 'other';
}

// ── APP ──────────────────────────────────────────
const G = {
  exps: [],
  curTab: 'today',
  listMonth: new Date(),
  statsPeriod: 'thisMonth',
  draft: [],
  ocrOk: false,
  ocrWorker: null,

  async start() {
    try { await DB.open(); } catch(e) { console.error(e); }
    try { this.exps = await DB.all(); } catch(e) { this.exps = []; }
    this.renderToday();
    document.getElementById('fabBtn').onclick = () => this.openAdd();
    // Init OCR in background (non-blocking)
    this.initOCR();
  },

  async initOCR() {
    try {
      if(typeof Tesseract === 'undefined') { this.ocrOk=false; return; }
      this.ocrWorker = await Tesseract.createWorker('chi_sim+eng', 1, {
        workerPath: 'worker.min.js',
        langPath: 'lang-data',
        logger: ()=>{}
      });
      this.ocrOk = true;
      console.log('OCR ready');
    } catch(e) {
      console.warn('OCR failed:', e);
      this.ocrOk = false;
    }
  },

  /* Preprocess image: grayscale + contrast boost → better OCR */
  preproc(img) {
    const c = document.createElement('canvas');
    const scale = 1200 / img.width;
    c.width = 1200; c.height = Math.floor(img.height * scale);
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height), p = d.data;
    for(let i=0; i<p.length; i+=4) {
      const g = p[i]*.299 + p[i+1]*.587 + p[i+2]*.114;
      const v = Math.max(0, Math.min(255, (g-128)*2.2+128));
      p[i]=p[i+1]=p[i+2]=v;
    }
    ctx.putImageData(d, 0, 0);
    return c;
  },

  /* Parse OCR text → structured expense */
  parseOCR(text) {
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    const full = lines.join(' ');
    // Source
    let source = 'other';
    if(full.includes('微信')||full.includes('WeChat')) source='wechat';
    else if(full.includes('支付宝')||full.includes('Alipay')) source='alipay';
    else if(full.includes('Apple')) source='applePay';
    // Amount
    let amount = null;
    for(const l of lines) {
      for(const p of [/¥\s*(\d+\.?\d{0,2})/,/￥\s*(\d+\.?\d{0,2})/,
        /(?:实付|付款|支付|消费|扣款|合计)[金额]?[：:\s]*¥?\s*(\d+\.?\d{0,2})/,
        /-\s*¥\s*(\d+\.?\d{0,2})/]) {
        const m=l.match(p); if(m){const v=parseFloat(m[1]);if(v>0&&v<100000){amount=v;break;}}
      }
      if(amount) break;
    }
    if(!amount) {
      let mx=0;
      for(const l of lines){const ms=l.match(/(\d+\.\d{2})/g);if(ms)for(const m of ms){const v=parseFloat(m);if(v>0&&v<100000&&v>mx)mx=v;}}
      amount=mx||null;
    }
    // Merchant
    let merchant = '';
    for(const l of lines) {
      for(const k of ['收款方','商户','商家','店铺','付款给','支付给','对方','交易对方']) {
        if(l.includes(k)){const p=l.split(/[：:]/);if(p.length>1){const n=p[p.length-1].trim();if(n.length>=2&&n.length<=40){merchant=n;break;}}}
      }
      if(merchant) break;
    }
    if(!merchant) {
      for(const l of lines) {
        if(/^[¥￥]/.test(l)) continue;
        if(/^(支付|微信|支付宝|付款|成功|交易|返回|完成)/.test(l)) continue;
        if(/^\d{2}:\d{2}/.test(l)||/^\d{4}[-\/年]/.test(l)) continue;
        if(l.length>=2&&l.length<=40){merchant=l;break;}
      }
    }
    // Date
    let date = new Date();
    for(const l of lines) {
      const m=l.match(/(\d{4}[-/\u5e74]\d{1,2}[-/\u6708]\d{1,2}\u65e5?\s*\d{1,2}:\d{2})/);
      if(m){const nd=new Date(m[1].replace(/[年月]/g,'-').replace(/[日]/g,''));if(!isNaN(nd.getTime())){date=nd;break;}}
    }
    return { amount, merchant: merchant||'', date, source, category: autoCat(merchant) };
  },

  tab(p) {
    this.curTab = p;
    document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('a', b.dataset.p === p));
    document.querySelectorAll('.page').forEach(pg => pg.classList.toggle('a', pg.id === 'p-' + p));
    if(p==='today') this.renderToday();
    else if(p==='list') this.renderList();
    else if(p==='stats') this.renderStats();
  },

  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('a');
    setTimeout(() => t.classList.remove('a'), 2200);
  },

  // ── SHEET ───────────────────────────────────
  openSheet(html) {
    document.getElementById('sheetBody').innerHTML = html;
    document.getElementById('overlay').classList.add('a');
  },
  closeSheet() { document.getElementById('overlay').classList.remove('a'); },

  // ── ADD EXPENSE ─────────────────────────────
  openAdd() {
    this.draft = [];
    this.openSheet(`
      <div class="sheetHdr">
        <button class="ghostBtn" onclick="G.closeSheet()">取消</button>
        <span class="sheetTitle">添加支出</span>
        <div style="width:44px"></div>
      </div>
      <label for="fu" class="upArea">
        <div class="upEmoji">📸</div>
        <div class="upTitle">选择支付截图</div>
        <div class="upHint">微信/支付宝付款截图，可多选</div>
        <div id="ocrStatus" style="font-size:12px;margin-top:8px"></div>
      </label>
      <button class="ghostBtn" style="width:100%;padding:10px;font-size:15px" onclick="G.draft=[{amount:0,merchant:'',date:new Date(),source:'other',category:'other',img:null}];G.showReview()">
        ✏️ 直接手动输入
      </button>
    `);
    // Show OCR readiness status
    const s = document.getElementById('ocrStatus');
    if(s) s.innerHTML = this.ocrOk
      ? '<span style="color:#34c759">✅ 自动识别已就绪</span>'
      : '<span style="color:#ff9500">⏳ 识别模型加载中，稍后自动就绪</span>';
  },

  async onFiles(input) {
    const files = input.files;
    if(!files || !files.length) return;
    this.draft = [];

    // Show loading state
    this.openSheet(`
      <div class="sheetHdr">
        <span></span>
        <span class="sheetTitle">${this.ocrOk ? '识别中...' : '加载截图...'}</span>
        <div style="width:44px"></div>
      </div>
      <div style="text-align:center;padding:60px 20px">
        <div style="font-size:48px;margin-bottom:16px">⏳</div>
        <div style="font-size:16px;font-weight:600;margin-bottom:8px">${this.ocrOk ? '正在识别支付信息' : '正在加载截图'}</div>
        <div style="font-size:13px;color:var(--txt2)">${this.ocrOk ? '提取金额、商户和时间...' : 'OCR初始化中，请稍候'}</div>
      </div>`);

    const fileArr = Array.from(files);
    for(let i=0; i<fileArr.length; i++) {
      const f = fileArr[i];
      // Read as data URL for preview
      const dataUrl = await new Promise(r => {
        const fr = new FileReader();
        fr.onload = () => r(fr.result);
        fr.readAsDataURL(f);
      });
      let parsed = { amount: 0, merchant: '', date: new Date(), source: 'other', category: 'other' };
      // Try OCR if available
      if(this.ocrOk && this.ocrWorker) {
        try {
          const img = await new Promise(r => {
            const im = new Image();
            im.onload = () => r(im);
            im.onerror = () => r(null);
            im.src = dataUrl;
          });
          if(img) {
            const pp = this.preproc(img);
            const result = await this.ocrWorker.recognize(pp);
            parsed = this.parseOCR(result.data.text);
          }
        } catch(e) { console.warn('OCR error:', e); }
      }
      this.draft.push({ ...parsed, img: dataUrl });
    }
    input.value = '';
    this.showReview();
  },

  showReview() {
    let items = '';
    this.draft.forEach((item, i) => {
      const catOpts = Object.entries(CAT)
        .map(([k,v]) => `<option value="${k}" ${item.category===k?'selected':''}>${v.e} ${v.n}</option>`)
        .join('');
      items += `
        <div style="background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px">
          ${item.img ? `<img src="${item.img}" class="preview">` : ''}
          <div class="frow">
            <label>💰 金额</label>
            <input type="number" step="0.01" min="0" inputmode="decimal" class="amtInput"
              value="${item.amount || ''}" placeholder="0.00"
              oninput="G.draft[${i}].amount=parseFloat(this.value)||0;G.refreshReviewBtn()">
          </div>
          <div class="frow">
            <label>🏪 商户</label>
            <input type="text" value="${esc(item.merchant)}" placeholder="在哪里消费"
              oninput="G.draft[${i}].merchant=this.value;G.autoCatItem(${i},this.value);G.refreshReviewBtn()">
          </div>
          <div class="frow">
            <label>📂 分类</label>
            <select id="cat_${i}" onchange="G.draft[${i}].category=this.value">${catOpts}</select>
          </div>
          <div class="frow">
            <label>💳 来源</label>
            <select onchange="G.draft[${i}].source=this.value">
              ${Object.entries(SRCS).map(([k,v])=>`<option value="${k}" ${item.source===k?'selected':''}>${v}</option>`).join('')}
            </select>
          </div>
          <div class="frow">
            <label>🕐 时间</label>
            <input type="datetime-local" value="${fmtDTL(item.date)}"
              onchange="G.draft[${i}].date=new Date(this.value)">
          </div>
        </div>`;
    });

    const total = this.draft.reduce((s, d) => s + (d.amount || 0), 0);
    this.openSheet(`
      <div class="sheetHdr">
        <button class="ghostBtn" onclick="G.openAdd()">← 返回</button>
        <span class="sheetTitle">确认记账</span>
        <button class="ghostBtn" onclick="G.draft.push({amount:0,merchant:'',date:new Date(),source:'other',category:'other',img:null});G.showReview()">+</button>
      </div>
      <div style="font-size:13px;color:var(--txt2);margin-bottom:10px">共 ${this.draft.length} 条，填好后点确认</div>
      ${items}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">
        <span style="color:var(--txt2);font-size:15px">合计</span>
        <span style="font-size:26px;font-weight:700;color:var(--red)">¥${total.toFixed(2)}</span>
      </div>
      <button class="primBtn" id="confirmBtn" onclick="G.confirm()"
        ${this.draft.every(d => d.amount > 0 && d.merchant.trim()) ? '' : 'disabled'}>
        ✅ 确认记账（${this.draft.length} 笔）
      </button>
    `);
  },

  autoCatItem(i, merchant) {
    const cat = autoCat(merchant);
    this.draft[i].category = cat;
    const sel = document.getElementById('cat_' + i);
    if(sel) sel.value = cat;
  },

  refreshReviewBtn() {
    const btn = document.getElementById('confirmBtn');
    if(btn) btn.disabled = !this.draft.every(d => d.amount > 0 && d.merchant.trim());
    // update total
    const total = this.draft.reduce((s, d) => s + (d.amount || 0), 0);
    const ts = document.querySelector('[style*="合计"]');
    if(ts && ts.nextElementSibling) ts.nextElementSibling.textContent = '¥' + total.toFixed(2);
  },

  async confirm() {
    for(const item of this.draft) {
      await DB.add({
        amount: item.amount,
        merchant: item.merchant.trim() || '未知商户',
        transactionDate: (item.date || new Date()).toISOString(),
        category: item.category || 'other',
        source: item.source || 'other',
        screenshot: item.img || null,
        createdAt: new Date().toISOString()
      });
    }
    try { this.exps = await DB.all(); } catch(e) {}
    this.closeSheet();
    this.tab(this.curTab);
    this.toast(`✅ 已记录 ${this.draft.length} 笔支出`);
  },

  // ── EXPENSE ROW HTML ────────────────────────
  erowHTML(e) {
    const c = CAT[e.category] || CAT.other;
    const d = new Date(e.transactionDate);
    const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `
      <div class="erow" onclick="G.detail(${e.id})">
        <div class="eico" style="background:${c.c}22">${c.e}</div>
        <div class="einfo">
          <div class="emer">${esc(e.merchant)}</div>
          <div class="emeta">
            <span>${time}</span>
            <span class="etag">${SRCS[e.source]||'其他'}</span>
            <span style="color:${c.c}">${c.n}</span>
          </div>
        </div>
        <div class="eamt">-¥${e.amount.toFixed(2)}</div>
      </div>`;
  },

  // ── DETAIL ──────────────────────────────────
  detail(id) {
    const e = this.exps.find(x => x.id === id);
    if(!e) return;
    const c = CAT[e.category] || CAT.other;
    const d = new Date(e.transactionDate);
    this.openSheet(`
      <div class="sheetHdr">
        <button class="ghostBtn" onclick="G.closeSheet()">关闭</button>
        <span class="sheetTitle">支出详情</span>
        <button class="ghostBtn dangerBtn" onclick="G.delExp(${e.id})">删除</button>
      </div>
      <div style="text-align:center;padding:20px 0 24px">
        <div style="font-size:13px;color:var(--txt2);margin-bottom:6px">支出金额</div>
        <div style="font-size:44px;font-weight:700;color:var(--red)">-¥${e.amount.toFixed(2)}</div>
      </div>
      ${e.screenshot ? `<img src="${e.screenshot}" class="preview" style="max-height:280px">` : ''}
      <div class="crd" style="margin-top:12px">
        <div class="frow"><label>商户</label><span style="flex:1;font-size:16px">${esc(e.merchant)}</span></div>
        <div class="frow"><label>分类</label><span style="flex:1;font-size:16px">${c.e} ${c.n}</span></div>
        <div class="frow"><label>时间</label><span style="flex:1;font-size:15px">${d.toLocaleString('zh-CN')}</span></div>
        <div class="frow"><label>支付</label><span style="flex:1;font-size:16px">${SRCS[e.source]||'其他'}</span></div>
      </div>
    `);
  },

  async delExp(id) {
    DB.del(id);
    try { this.exps = await DB.all(); } catch(e) {}
    this.closeSheet();
    this.tab(this.curTab);
    this.toast('已删除');
  },

  // ── TODAY ────────────────────────────────────
  renderToday() {
    const todayStart = new Date(); todayStart.setHours(0,0,0,0);
    const te = this.exps.filter(e => new Date(e.transactionDate) >= todayStart);
    const total = te.reduce((s,e) => s + e.amount, 0);

    const catMap = {};
    te.forEach(e => { catMap[e.category] = (catMap[e.category]||0) + e.amount; });

    let h = `
      <div class="crd">
        <div class="bigAmt">
          <div class="val ${total?'':'zero'}">¥${total.toFixed(2)}</div>
          <div class="sub">${te.length ? `今日共 ${te.length} 笔支出` : '今日暂无支出，点 + 记账'}</div>
        </div>
      </div>`;

    if(Object.keys(catMap).length) {
      h += `<div class="crd"><div class="clbl">分类明细</div>`;
      Object.entries(catMap).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt]) => {
        const c = CAT[cat]||CAT.other;
        const pct = (amt/total*100).toFixed(0);
        h += `<div class="catrow">
          <div class="catic" style="background:${c.c}22">${c.e}</div>
          <span style="flex:1;font-size:15px">${c.n}</span>
          <span style="font-size:15px;font-weight:600">¥${amt.toFixed(2)}</span>
          <span style="font-size:12px;color:var(--txt2);width:36px;text-align:right">${pct}%</span>
        </div>`;
      });
      h += `</div>`;
    }

    if(te.length) {
      h += `<div class="crd"><div class="clbl">今日明细</div>`;
      te.sort((a,b)=>new Date(b.transactionDate)-new Date(a.transactionDate))
        .forEach(e => { h += this.erowHTML(e); });
      h += `</div>`;
    }

    document.getElementById('todayC').innerHTML = h;
  },

  // ── LIST ─────────────────────────────────────
  renderList() {
    const y = this.listMonth.getFullYear(), m = this.listMonth.getMonth();
    const start = new Date(y, m, 1), end = new Date(y, m+1, 0, 23, 59, 59);
    const mx = this.exps
      .filter(e => { const d=new Date(e.transactionDate); return d>=start&&d<=end; })
      .sort((a,b) => new Date(b.transactionDate)-new Date(a.transactionDate));
    const total = mx.reduce((s,e)=>s+e.amount, 0);
    const isCur = y===new Date().getFullYear() && m===new Date().getMonth();

    // Group by date
    const gr = {};
    mx.forEach(e => {
      const dk = new Date(e.transactionDate).toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
      (gr[dk] = gr[dk]||[]).push(e);
    });

    let h = `
      <div class="msel">
        <button onclick="G.shiftM(-1)">◀</button>
        <span class="mlbl">${isCur?'本月':y+'年'+(m+1)+'月'}</span>
        <button onclick="G.shiftM(1)" ${isCur?'disabled':''}>▶</button>
      </div>
      <div class="crd" style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px">
        <div>
          <div style="font-size:12px;color:var(--txt2)">本月支出</div>
          <div style="font-size:22px;font-weight:700;color:var(--red)">¥${total.toFixed(2)}</div>
        </div>
        <div style="font-size:13px;color:var(--txt2)">共 ${mx.length} 笔</div>
      </div>`;

    if(!mx.length) {
      h += `<div class="empty"><div class="emptyIco">📭</div><div>本月暂无账单</div></div>`;
    } else {
      h += `<div class="crd">`;
      for(const [dk, exs] of Object.entries(gr)) {
        const dayTotal = exs.reduce((s,e)=>s+e.amount,0);
        h += `<div style="font-size:13px;font-weight:600;color:var(--txt2);padding:14px 0 8px;display:flex;justify-content:space-between">
          <span>${dk}</span><span>-¥${dayTotal.toFixed(2)}</span></div>`;
        exs.forEach(e => { h += this.erowHTML(e); });
      }
      h += `</div>`;
    }
    document.getElementById('listC').innerHTML = h;
  },

  shiftM(d) {
    const m = new Date(this.listMonth);
    m.setMonth(m.getMonth()+d);
    if(m <= new Date()) { this.listMonth = m; this.renderList(); }
  },

  // ── STATS ────────────────────────────────────
  renderStats() {
    const now = new Date();
    let start;
    switch(this.statsPeriod) {
      case 'lastMonth': start = new Date(now.getFullYear(), now.getMonth()-1, 1); break;
      case 'last7Days': start = new Date(now); start.setDate(start.getDate()-6); start.setHours(0,0,0,0); break;
      case 'last30Days': start = new Date(now); start.setDate(start.getDate()-29); start.setHours(0,0,0,0); break;
      default: start = new Date(now.getFullYear(), now.getMonth(), 1);
    }
    let end = (this.statsPeriod==='lastMonth')
      ? new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59)
      : now;

    const fd = this.exps.filter(e => { const d=new Date(e.transactionDate); return d>=start&&d<=end; });
    const total = fd.reduce((s,e)=>s+e.amount,0);
    const cnt = fd.length, avg = cnt?total/cnt:0;

    const periods = {thisMonth:'本月',lastMonth:'上月',last7Days:'近7天',last30Days:'近30天'};
    let h = `<div class="psel">`;
    for(const [k,v] of Object.entries(periods))
      h += `<button class="pbt ${this.statsPeriod===k?'a':''}" onclick="G.statsPeriod='${k}';G.renderStats()">${v}</button>`;
    h += `</div>
      <div class="scards">
        <div class="scard"><div class="sv" style="color:var(--red)">¥${total.toFixed(2)}</div><div class="sl">总支出</div></div>
        <div class="scard"><div class="sv" style="color:var(--blue)">${cnt}</div><div class="sl">笔数</div></div>
        <div class="scard"><div class="sv" style="color:var(--org)">¥${avg.toFixed(2)}</div><div class="sl">笔均</div></div>
      </div>`;

    // Category breakdown
    const cm = {};
    fd.forEach(e => { cm[e.category]=(cm[e.category]||0)+e.amount; });
    const cl = Object.entries(cm)
      .map(([k,v])=>({k,v,...(CAT[k]||CAT.other)}))
      .sort((a,b)=>b.v-a.v);

    if(cl.length) {
      // Pie chart SVG
      h += `<div class="crd"><div class="clbl">支出分类</div>${this.drawPie(cl,total)}</div>`;
      // Ranking
      h += `<div class="crd"><div class="clbl">分类排行</div>`;
      cl.forEach((it,i) => {
        const pct = (it.v/total*100);
        h += `<div class="erow" style="cursor:default">
          <div style="width:22px;height:22px;border-radius:50%;background:${it.c};color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</div>
          <span style="font-size:18px">${it.e}</span>
          <span style="flex:1;font-size:15px">${it.n}</span>
          <span style="font-size:15px;font-weight:600">¥${it.v.toFixed(2)}</span>
          <div style="width:50px;height:6px;background:var(--bg);border-radius:3px;margin-left:8px;overflow:hidden;flex-shrink:0">
            <div style="width:${pct}%;height:100%;background:${it.c};border-radius:3px"></div>
          </div>
        </div>`;
      });
      h += `</div>`;
    }

    // Daily bar chart
    h += `<div class="crd"><div class="clbl">每日趋势</div>${this.drawBars(fd, start, end)}</div>`;

    document.getElementById('statsC').innerHTML = h;
  },

  drawPie(data, total) {
    const r=70, cx=100, cy=85;
    let angle = -Math.PI/2;
    let paths = '';
    data.forEach(d => {
      const slice = (d.v/total)*Math.PI*2;
      const x1=cx+Math.cos(angle)*r, y1=cy+Math.sin(angle)*r;
      const x2=cx+Math.cos(angle+slice)*r, y2=cy+Math.sin(angle+slice)*r;
      const la = slice>Math.PI?1:0;
      const mx=cx+Math.cos(angle+slice/2)*r*.65, my=cy+Math.sin(angle+slice/2)*r*.65;
      paths += `<path d="M${cx},${cy}L${x1.toFixed(1)},${y1.toFixed(1)}A${r},${r} 0 ${la},1 ${x2.toFixed(1)},${y2.toFixed(1)}Z" fill="${d.c}" stroke="var(--card)" stroke-width="2"/>`;
      if(slice>0.3) paths += `<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#fff" font-weight="700">${(d.v/total*100).toFixed(0)}%</text>`;
      angle += slice;
    });
    paths += `<circle cx="${cx}" cy="${cy}" r="36" fill="var(--card)"/>`;
    paths += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="var(--txt2)">¥${(total/100).toFixed(0)}百</text>`;
    return `<svg viewBox="0 0 200 170" style="width:100%;max-height:170px">${paths}</svg>`;
  },

  drawBars(exps, start, end) {
    const days = [];
    const s = new Date(start); s.setHours(0,0,0,0);
    for(let d=new Date(s); d<=end; d.setDate(d.getDate()+1)) {
      const k = d.toISOString().slice(0,10);
      const t = exps.filter(e=>new Date(e.transactionDate).toISOString().slice(0,10)===k)
                    .reduce((s,e)=>s+e.amount,0);
      days.push({label:`${d.getMonth()+1}/${d.getDate()}`,total:t});
    }
    if(!days.length) return '<div style="color:var(--txt3);text-align:center;padding:20px">暂无数据</div>';
    const mx = Math.max(...days.map(d=>d.total), 1);
    const showLabel = days.length <= 15;
    return `
      <div class="barWrap">
        <div class="barChart">
          ${days.map(d=>`
            <div style="display:flex;flex-direction:column;align-items:center;flex:1">
              <div title="¥${d.total.toFixed(2)}" style="width:100%;border-radius:3px 3px 0 0;background:${d.total?'#4ECDC4':'var(--sep)'};height:${Math.max(2,(d.total/mx)*96)}px"></div>
              ${showLabel?`<div class="barLbl">${d.label.split('/')[1]}</div>`:''}
            </div>`).join('')}
        </div>
      </div>`;
  }
};

// Start
G.start();
</script>
</body>
</html>
